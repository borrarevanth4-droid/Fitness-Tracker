version: '3.8'

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: antigravity-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-antigravity}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - antigravity-net

  redis:
    image: redis:7-alpine
    container_name: antigravity-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - antigravity-net

  minio:
    image: minio/minio:latest
    container_name: antigravity-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"   # MinIO console (admin only, separate port)
    volumes:
      - minio-data:/data
    networks:
      - antigravity-net

  # ─── Application ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antigravity-backend
    restart: always
    env_file:
      - .env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-antigravity}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      FRONTEND_URL: http://localhost
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - antigravity-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antigravity-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost
    depends_on:
      - backend
    networks:
      - antigravity-net

  # ─── Reverse Proxy (single entry point) ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: antigravity-nginx
    restart: always
    ports:
      - "80:80"       # ← Single URL: http://localhost
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - antigravity-net

networks:
  antigravity-net:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  minio-data:
